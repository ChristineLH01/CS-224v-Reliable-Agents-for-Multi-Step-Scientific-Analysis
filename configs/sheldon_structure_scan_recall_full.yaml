# Structured candidate scan (candidate_scan_mode: structured), recall on the questions SHELDON
# never solves, 3 attempts each. Two isolated calls: `structure` maps the data and writes full
# tables without proposing answers; `identify` names each feature through reference lookups,
# then lists candidates with the features each explains. Otherwise identical to the v2 scan
# configs, except candidate_scan_mode, the per-call probe ceilings, the image and a 40-min
# sandbox limit (two calls instead of one). Stops after plan + the scan;
# scripts/eval_candidate_recall.py grades each candidate.
n_attempts: 3
concurrency: 2
dataset:
  name: full
  human_solvable: null
  delete_after_problem: false
  problem_ids:
  - hb048
  - recaikavdwoimjy3b
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  finalize_timeout_s: 300
  adaptations:
  - candidate_scan
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell:
          max_output: 8000
      candidate_analysis_probe_calls: 12
      comparative_analysis_probe_calls: 10
      select_probe_calls: 2
      exploit_probe_calls: 4
      analysis_summary_chars: 10000
      candidate_scan_only: true
      candidate_scan_max: 10
      candidate_scan_min: 3
      candidate_scan_mode: structured
      candidate_scan_max_features: 12
      candidate_scan_structure_probe_calls: 20
      candidate_scan_identify_probe_calls: 20
sandbox:
  image: bmbench-sandbox:structure-scan
  cpus: 4
  memory: 3.5g
  timeout_s: 2400
  network: allowlist
  keep_workspace: false
grader:
  auto: false
  model: claude-opus-5-5
  effort: medium
run_name: structure_scan_recall_full_3attempts_20261116
