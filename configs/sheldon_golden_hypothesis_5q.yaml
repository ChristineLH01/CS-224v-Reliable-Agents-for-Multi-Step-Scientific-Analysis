# Oracle ablation (golden_hypothesis): round 1 holds one extra hypothesis stating the correct
# answer, written by a hidden call in the style of the model's own three and inserted at a
# random position; the model's submit_exploration call is rewritten to hold it. The answer
# reaches the sandbox only on the driver's stdin (bmb_sheldon/adapted/golden_hypothesis.py).
# Run on the 5 baseline questions not solved 3/3: hb024, hb048 and recaikavdwoimjy3b (answer
# never in round 1) and hb035, recsvhviava5okg19 (in round 1, then lost). 3 attempts each.
# Everything else is the baseline run's own config.yaml, verbatim:
# runs 2/preview_sheldon_gpt-6-luna_high_3-rounds_timeout-1h_3-attempts/config.yaml
# (image: tenq-v1 plus the current bmb_sheldon runtime). Graded automatically, like the baseline.
run_name: golden_hypothesis_5q_3attempts_20261116
runs_dir: runs
n_attempts: 3
concurrency: 2
prompt_template: prompts/problem.md
dataset:
  name: full
  root: data
  problem_ids:
  - hb024
  - hb048
  - recaikavdwoimjy3b
  - hb035
  - recsvhviava5okg19
  human_solvable: null
  delete_after_problem: true
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  permission_mode: bypassPermissions
  disallowed_tools:
  - WebSearch
  - AskUserQuestion
  max_budget_usd: null
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  extra_args: []
  env: {}
  finalize_on_timeout: true
  finalize_timeout_s: 300
  # problem id -> the answer each injected hypothesis states, from a git-ignored file (its
  # header says how it was made); not in this config, so no committed file states an answer.
  golden_answers: data/golden_answers.yaml
  max_nudges: 1
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell
sandbox:
  image: bmbench-sandbox:golden-hypothesis
  proxy_image: bmbench-proxy:latest
  platform: null
  cpus: 4
  memory: 3.5g
  timeout_s: 3600
  network: allowlist
  infra_domains:
  - files.pythonhosted.org
  extra_allowed_domains: []
  override_allowed_domains: null
  input_mode: copy
  keep_workspace: false
  keep_input_data: false
grader:
  auto: true
  model: claude-opus-5-5
  effort: medium
  usd_per_mtok:
  - 2.0
  - 10.0
  timeout_s: 600
  max_action_log_chars: 150000
  max_final_message_chars: 6000
