# Codex (unchanged) on BioMysteryBench-full (90 problems), under the same settings
# as configs/claude_code_full.yaml. Problems run one at a time: each one's data is
# downloaded before its attempts and deleted after them.
# The run folder is named from the settings (see auto_run_name in bmbench/config.py).
n_attempts: 3           # attempts per problem
concurrency: 2

dataset:
  name: full
  problem_ids: null
  human_solvable: null
  delete_after_problem: true

agent:
  type: codex
  model: gpt-6.1-sol
  effort: high
  usd_per_mtok: [2.0, 0.10, 10.0]

sandbox:
  cpus: 4
  memory: 3.5g
  timeout_s: 3600
  network: allowlist
  keep_workspace: false

grader:
  auto: true
  model: claude-opus-5-5   # claude -p on the Claude subscription
  effort: medium
