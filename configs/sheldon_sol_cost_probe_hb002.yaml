# Cost probe: baseline SHELDON (no adaptations) on gpt-6.1-sol, one attempt of hb002, to
# measure real usage before a full run. Everything else is the runs 2 SHELDON baseline's
# config.yaml (runs 2/preview_sheldon_gpt-6-luna_high_3-rounds_timeout-1h_3-attempts), except
# the price table (OpenAI list price for gpt-6.1-sol, as in configs/codex_preview.yaml) and
# the image: bmbench-sandbox:golden-hypothesis, the current runtime (adaptations stay off).
# hb002 is the median-cost question there ($0.116, 25 min on luna) and was solved 3/3.
run_name: sheldon_sol_cost_probe_hb002_1attempt
runs_dir: runs
n_attempts: 1
concurrency: 2
prompt_template: prompts/problem.md
dataset:
  name: full
  root: data
  problem_ids:
  - hb002
  human_solvable: null
  delete_after_problem: true
agent:
  type: sheldon
  model: gpt-6.1-sol
  effort: high
  permission_mode: bypassPermissions
  disallowed_tools:
  - WebSearch
  - AskUserQuestion
  max_budget_usd: null
  usd_per_mtok:
  - 2.0
  - 0.1
  - 10.0
  extra_args: []
  env: {}
  finalize_on_timeout: true
  finalize_timeout_s: 300
  max_nudges: 1
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell
sandbox:
  image: bmbench-sandbox:golden-hypothesis
  proxy_image: bmbench-proxy:latest
  platform: null
  cpus: 4
  memory: 3.5g
  timeout_s: 3600
  network: allowlist
  infra_domains:
  - files.pythonhosted.org
  extra_allowed_domains: []
  override_allowed_domains: null
  input_mode: copy
  keep_workspace: false
  keep_input_data: false
grader:
  auto: true
  model: claude-opus-5-5
  effort: medium
  usd_per_mtok:
  - 2.0
  - 10.0
  timeout_s: 600
  max_action_log_chars: 150000
  max_final_message_chars: 6000
