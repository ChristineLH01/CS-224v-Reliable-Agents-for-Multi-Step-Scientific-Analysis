# Candidate-scan recall: the same ten questions as the 10q run (this file: the preview five),
# 3 attempts each. The run stops after plan + the candidate scan (candidate_scan_only), so
# nothing is graded by bmbench; scripts/eval_candidate_recall.py grades each candidate.
# Everything else matches configs/sheldon_adapted_10q_preview.yaml. explore_probe_calls is kept
# for reference: the scan gets the same 20-call ceiling round-1 explore has.
n_attempts: 3
concurrency: 2
dataset:
  name: preview
  delete_after_problem: false
  problem_ids:
  - hb002
  - hb020
  - recqgsfxqqodhjens
  - hb035
  - hb024
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  finalize_timeout_s: 300
  adaptations:
  - candidate_scan
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell:
          max_output: 8000
      candidate_analysis_probe_calls: 12
      comparative_analysis_probe_calls: 10
      select_probe_calls: 2
      exploit_probe_calls: 4
      analysis_summary_chars: 10000
      candidate_scan_only: true
      candidate_scan_max: 10
      candidate_scan_probe_calls: 20
sandbox:
  image: bmbench-sandbox:candidate-scan
  cpus: 4
  memory: 3.5g
  timeout_s: 1200
  network: allowlist
  keep_workspace: false
grader:
  auto: false
  model: claude-opus-5-5
  effort: medium
run_name: candidate_scan_recall_preview_3attempts_20261115
