# Claude Code (unchanged) on BioMysteryBench-full (90 problems), with the same
# per-attempt resources as the preview.
# Problems run one at a time: each one's data is downloaded before its attempts and
# deleted after them, so only about two problems' data is on disk at once.
# The run folder is named from the settings (see auto_run_name in bmbench/config.py).
n_attempts: 3           # attempts per problem
concurrency: 2        # 2 × (4 CPUs, 3.5 GB), as for the preview

dataset:
  name: full
  problem_ids: null        # null = every problem in problems.csv
  human_solvable: null  # or "yes" / "no"
  delete_after_problem: true

agent:
  type: claude_code
  model: claude-opus-5-5
  effort: high

sandbox:
  cpus: 4
  memory: 3.5g
  timeout_s: 3600       # 1 h wall clock per attempt; re-run timed-out problems with more
  network: allowlist
  keep_workspace: false

grader:
  auto: true
  model: claude-opus-5-5   # claude -p on the Claude subscription
  effort: medium
