# Claude Code (unchanged) on BioMysteryBench-full (90 problems). Template: the
# resources assume a Linux server; several problems carry 10-27 GB of zipped data.
# Prepare a subset first: bmbench prepare --dataset full --ids hb001,hb002,...
run_name: claude-code_opus-5-5_high__full
n_trials: 5
concurrency: 2

dataset:
  name: full
  task_ids: null        # null = every problem in problems.csv (prepare them first)
  human_solvable: null  # or "yes" / "no"

agent:
  type: claude_code
  model: claude-opus-5-5
  effort: high

sandbox:
  cpus: 16
  memory: 64g
  timeout_s: 10800      # 3 h wall clock per trial
  network: allowlist

grader:
  auto: true
  model: claude-opus-5-5
  effort: medium
