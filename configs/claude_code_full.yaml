# Claude Code (unchanged) on BioMysteryBench-full (90 problems). Template: the
# resources assume a Linux server; several problems carry 10-27 GB of zipped data.
# Questions run one at a time: each one's data is downloaded before its trials and
# deleted after them, so only about two questions' data is on disk at once.
run_name: claude-code_opus-5-5_high__full
n_trials: 5
concurrency: 2

dataset:
  name: full
  task_ids: null        # null = every problem in problems.csv
  human_solvable: null  # or "yes" / "no"
  delete_after_task: true

agent:
  type: claude_code
  model: claude-opus-5-5
  effort: high

sandbox:
  cpus: 16
  memory: 64g
  timeout_s: 3600       # 1 h wall clock per trial; re-run timed-out questions with more
  network: allowlist
  keep_workspace: false

grader:
  auto: true
  model: gpt-6-sol
  effort: medium
