# plan_keeps_question on top of early_stop + shared_analysis_state, on the ten 10q questions,
# 3 attempts each. Baseline: the shared-state v2 runs (17/30), split over
# runs/adapted_shared_state_v2_{remaining_preview,remaining_full,hb035,hb010}_3attempts_20261113,
# whose config this is, with plan_keeps_question added and all ten questions in one run.
# Image bmbench-sandbox:pkq-es-ss is a tag of bmbench-sandbox:golden-hypothesis (the current
# runtime): its early_stop.py and shared_analysis_state.py are identical to the
# shared-state-v2 image's; method.py and driver.py differ only by the later adaptations' hooks.
run_name: pkq_es_ss_10q_3attempts_20261122
runs_dir: runs
n_attempts: 3
concurrency: 2
prompt_template: prompts/problem.md
dataset:
  name: full
  root: data
  problem_ids:
  - hb002
  - hb020
  - recqgsfxqqodhjens
  - hb024
  - hb035
  - hb048
  - rec5qx7nedrwk4zog
  - hb010
  - recaikavdwoimjy3b
  - recsvhviava5okg19
  human_solvable: null
  delete_after_problem: false
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  permission_mode: bypassPermissions
  disallowed_tools:
  - WebSearch
  - AskUserQuestion
  max_budget_usd: null
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  extra_args: []
  env: {}
  finalize_on_timeout: true
  finalize_timeout_s: 300
  max_nudges: 1
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell:
          max_output: 8000
      candidate_analysis_probe_calls: 12
      comparative_analysis_probe_calls: 10
      select_probe_calls: 2
      exploit_probe_calls: 4
      analysis_summary_chars: 10000
  adaptations:
  - early_stop
  - shared_analysis_state
  - plan_keeps_question
sandbox:
  image: bmbench-sandbox:pkq-es-ss
  proxy_image: bmbench-proxy:latest
  platform: null
  cpus: 4
  memory: 3.5g
  timeout_s: 3600
  network: allowlist
  infra_domains:
  - files.pythonhosted.org
  extra_allowed_domains: []
  override_allowed_domains: null
  input_mode: copy
  keep_workspace: false
  keep_input_data: false
grader:
  auto: false
  model: claude-opus-5-5
  effort: medium
  usd_per_mtok:
  - 2.0
  - 10.0
  timeout_s: 600
  max_action_log_chars: 150000
  max_final_message_chars: 6000
