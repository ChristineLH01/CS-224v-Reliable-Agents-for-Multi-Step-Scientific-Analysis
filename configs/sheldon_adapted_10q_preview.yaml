# Ten-question replication: 5 preview + 5 full, 3 attempts each.
# Explicit adaptations and shell cap; grading deferred, input data retained.
n_attempts: 3
concurrency: 2
dataset:
  name: preview
  delete_after_problem: false
  problem_ids:
  - hb002
  - hb020
  - recqgsfxqqodhjens
  - hb035
  - hb024
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  finalize_timeout_s: 300
  adaptations:
  - early_stop
  - shared_analysis_state
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell:
          max_output: 8000
      candidate_analysis_probe_calls: 12
      comparative_analysis_probe_calls: 10
      select_probe_calls: 2
      exploit_probe_calls: 4
      analysis_summary_chars: 10000
sandbox:
  cpus: 4
  memory: 3.5g
  timeout_s: 3600
  network: allowlist
  keep_workspace: false
grader:
  auto: false
  model: claude-opus-5-5
  effort: medium
run_name: adapted_10q_preview_3attempts_shell8000_20261112
