# Oracle ablation (golden_hypothesis) with plan_keeps_question on: the same run as
# configs/sheldon_golden_hypothesis_5q.yaml, plus the adaptation that keeps the question in
# the plan's situation (in 4 of that run's 15 attempts, plan put it only in the deliverable).
# Started on another machine (Windows, image bmbench-sandbox:latest built 2026-11-20 from the
# current runtime); finished here on bmbench-sandbox:golden-hypothesis, whose bmb_sheldon
# differs from the current runtime only in a docstring.
run_name: golden_hypothesis_plan-keeps-question_5q_3attempts_20261120
runs_dir: runs
n_attempts: 3
concurrency: 2
prompt_template: prompts/problem.md
dataset:
  name: full
  root: data
  problem_ids:
  - hb024
  - hb048
  - recaikavdwoimjy3b
  - hb035
  - recsvhviava5okg19
  human_solvable: null
  delete_after_problem: false
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  permission_mode: bypassPermissions
  disallowed_tools:
  - WebSearch
  - AskUserQuestion
  max_budget_usd: null
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  extra_args: []
  env: {}
  finalize_on_timeout: true
  finalize_timeout_s: 300
  max_nudges: 1
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell
  adaptations:
  - plan_keeps_question
  golden_answers: data/golden_answers.yaml  # git-ignored: problem id -> answer
sandbox:
  image: bmbench-sandbox:golden-hypothesis
  proxy_image: bmbench-proxy:latest
  platform: null
  cpus: 4
  memory: 3.5g
  timeout_s: 3600
  network: allowlist
  infra_domains:
  - files.pythonhosted.org
  extra_allowed_domains: []
  override_allowed_domains: null
  input_mode: copy
  keep_workspace: false
  keep_input_data: false
grader:
  auto: true
  model: claude-opus-5-5
  effort: medium
  usd_per_mtok:
  - 2.0
  - 10.0
  timeout_s: 600
  max_action_log_chars: 150000
  max_final_message_chars: 6000
