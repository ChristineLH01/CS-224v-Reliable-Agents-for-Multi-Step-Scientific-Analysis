# Candidate-scan recall, prompt v2 (this file: the full five of the 10q questions), 1 attempt each
# for prompt iteration. v2 asks for lookups when the data alone does not settle the answer, at
# least 3 candidates (candidate_scan_min; a short list gets one follow-up call), and an answer
# per reasonable method choice. Otherwise identical to sheldon_candidate_scan_recall_full.yaml
# (v1). Stops after plan + the scan; scripts/eval_candidate_recall.py grades each candidate.
n_attempts: 1
concurrency: 2
dataset:
  name: full
  problem_ids:
  - hb048
  - rec5qx7nedrwk4zog
  - hb010
  - recaikavdwoimjy3b
  - recsvhviava5okg19
  human_solvable: null
  delete_after_problem: false
agent:
  type: sheldon
  model: gpt-6-luna
  effort: high
  usd_per_mtok:
  - 0.1
  - 0.01
  - 0.5
  finalize_timeout_s: 300
  adaptations:
  - candidate_scan
  sheldon:
    method: sheldon
    engine: toolloop
    max_rounds: 3
    max_calls: null
    max_usd: null
    max_tokens: 16000
    trace_prompts: true
    params:
      mode: session
      rounds: 3
      plan: true
      n_initial: 3
      n_explore: 3
      select_k: 3
      candidate_analysis_concurrent: true
      candidate_analysis_max_evals: 3
      stage_probes: true
      explore_probe_calls: 20
      finalize_probe_calls: 20
      probes:
      - run_shell:
          max_output: 8000
      candidate_analysis_probe_calls: 12
      comparative_analysis_probe_calls: 10
      select_probe_calls: 2
      exploit_probe_calls: 4
      analysis_summary_chars: 10000
      candidate_scan_only: true
      candidate_scan_max: 10
      candidate_scan_min: 3
      candidate_scan_probe_calls: 20
sandbox:
  image: bmbench-sandbox:candidate-scan-v2
  cpus: 4
  memory: 3.5g
  timeout_s: 1200
  network: allowlist
  keep_workspace: false
grader:
  auto: false
  model: claude-opus-5-5
  effort: medium
run_name: candidate_scan_recall_v2_full_1attempt_20261115
