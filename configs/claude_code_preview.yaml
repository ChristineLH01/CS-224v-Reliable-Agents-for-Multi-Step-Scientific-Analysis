# Claude Code (unchanged) on the 5-problem BioMysteryBench preview.
# Every field not listed here takes its default from bmbench/config.py.
# The run folder is named from the settings (see auto_run_name in bmbench/config.py).
n_attempts: 3           # attempts per problem
concurrency: 2        # 2 × (4 CPUs, 3.5 GB) fits Docker Desktop's 8 CPUs / 7.6 GB

dataset:
  name: preview
  delete_after_problem: true   # each problem's data is downloaded before its attempts, deleted after

agent:
  type: claude_code
  model: claude-opus-5-5
  effort: high
  disallowed_tools: [WebSearch, AskUserQuestion]
  finalize_on_timeout: true
  finalize_timeout_s: 180   # the "best answer now" turn after a timeout or running out of memory
  max_nudges: 1

sandbox:
  cpus: 4
  memory: 3.5g
  timeout_s: 3600     # 1 h wall clock per attempt
  network: allowlist
  keep_workspace: false   # delete each attempt's workspace (workspace_files.tsv lists it)

grader:
  auto: true
  model: claude-opus-5-5   # claude -p on the Claude subscription
  effort: medium
