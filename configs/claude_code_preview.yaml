# Claude Code (unchanged) on the 5-problem BioMysteryBench preview.
# Every field not listed here takes its default from bmbench/config.py.
run_name: preview-data_claude-code_opus-5-5_high
n_trials: 5           # same as the BioMysteryBench post
concurrency: 2        # 2 × (4 CPUs, 3.5 GB) fits Docker Desktop's 8 CPUs / 7.6 GB

dataset:
  name: preview

agent:
  type: claude_code
  model: claude-opus-5-5
  effort: high
  disallowed_tools: [WebSearch, AskUserQuestion]
  finalize_on_timeout: true
  finalize_timeout_s: 180   # the "best answer now" turn after a timeout
  max_nudges: 1

sandbox:
  cpus: 4
  memory: 3.5g
  timeout_s: 1800     # 30 min wall clock per trial
  network: allowlist

grader:
  auto: true
  model: claude-opus-5-5
  effort: medium
