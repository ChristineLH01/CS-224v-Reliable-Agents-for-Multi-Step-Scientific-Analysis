http_port 3128
pid_filename none
visible_hostname bmbench-proxy
shutdown_lifetime 1 seconds
pinger_enable off

# Forwarding proxy only: no caching, no identifying headers.
cache deny all
cache_mem 8 MB
forwarded_for delete
via off

acl allowed_domains dstdomain "/etc/squid/allowed_domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443 21
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# time  client  squid-status/http-code  method  url(host:port for CONNECT)  bytes
logformat bmbench %{%Y-%m-%dT%H:%M:%S}tg %>a %Ss/%03>Hs %rm %ru %<st
access_log stdio:/var/log/bmbench/access.log bmbench
cache_log stdio:/var/log/bmbench/cache.log
logfile_rotate 0
