[project]
name = "bmbench"
version = "0.1.0"
description = "Evaluate coding agents (Claude Code first) on BioMysteryBench: accuracy and consistency over repeated runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
    "truststore>=0.10",
]

[project.scripts]
bmbench = "bmbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
