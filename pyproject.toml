[project]
name = "bmbench"
version = "0.1.0"
description = "Evaluate coding agents (Claude Code first) on BioMysteryBench: accuracy and consistency over repeated runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
    "truststore>=0.10",
]

[project.scripts]
bmbench = "bmbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# SHELDON itself, at the commit the sandbox image installs, for the tests of
# bmbench/agents/sheldon_runtime (uv run --group dev --group sheldon pytest).
sheldon = [
    "sheldon @ git+https://github.com/stanford-oval/sheldon@7fbf027d1fb414443612d4ad2661b396c8352cd3",
    "openai==3.5.0",
    "anthropic==1.2.0",
    "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
